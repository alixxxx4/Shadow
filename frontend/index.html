<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shadow.Ai</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #0b0b0d;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 280px;
            background: #111114;
            border-left: 1px solid #27272c;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .logo {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: #000;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }

        .brand-text h1 {
            margin: 0;
            font-size: 20px;
        }

        .brand-text span {
            color: #999;
            font-size: 12px;
        }

        .new-chat {
            border: none;
            background: #5b4cff;
            color: white;
            padding: 13px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-family: inherit;
            margin-bottom: 25px;
        }

        .new-chat:hover {
            background: #6c5cff;
        }

        .menu-title {
            color: #777;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .history {
            flex: 1;
            overflow-y: auto;
        }

        .history-item {
            padding: 11px;
            border-radius: 8px;
            color: #ccc;
            margin-bottom: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .history-item:hover {
            background: #1d1d22;
        }

        .settings {
            border-top: 1px solid #29292e;
            padding-top: 18px;
            color: #aaa;
            cursor: pointer;
        }

        /* CHAT */

        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .topbar {
            height: 70px;
            border-bottom: 1px solid #27272c;
            display: flex;
            align-items: center;
            padding: 0 30px;
        }

        .topbar-title {
            font-size: 17px;
            font-weight: bold;
        }

        .status {
            margin-right: 15px;
            color: #65d98b;
            font-size: 12px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 40px 10%;
        }

        .welcome {
            max-width: 700px;
            margin: 100px auto;
            text-align: center;
        }

        .welcome-logo {
            width: 80px;
            height: 80px;
            background: #000;
            border: 1px solid #333;
            border-radius: 20px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            font-weight: bold;
        }

        .welcome h2 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .welcome p {
            color: #999;
            line-height: 2;
        }

        .message {
            display: flex;
            margin-bottom: 25px;
            gap: 12px;
        }

        .message.user {
            justify-content: flex-start;
        }

        .message.ai {
            justify-content: flex-end;
        }

        .avatar {
            width: 38px;
            height: 38px;
            min-width: 38px;
            border-radius: 10px;
            background: #18181c;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .bubble {
            max-width: 75%;
            padding: 14px 17px;
            border-radius: 15px;
            line-height: 1.9;
            white-space: pre-wrap;
        }

        .user .bubble {
            background: #25252b;
        }

        .ai .bubble {
            background: #151519;
            border: 1px solid #29292f;
        }

        /* INPUT */

        .input-area {
            padding: 20px 10%;
            border-top: 1px solid #202025;
            background: #0b0b0d;
        }

        .input-box {
            max-width: 900px;
            margin: auto;
            display: flex;
            gap: 10px;
            background: #151519;
            border: 1px solid #36363d;
            border-radius: 14px;
            padding: 8px;
        }

        textarea {
            flex: 1;
            resize: none;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font-family: inherit;
            font-size: 15px;
            padding: 12px;
            height: 48px;
        }

        textarea::placeholder {
            color: #777;
        }

        .send {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: #5b4cff;
            color: white;
            cursor: pointer;
            font-size: 20px;
        }

        .send:hover {
            background: #6c5cff;
        }

        .send:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .typing {
            color: #888;
            font-size: 13px;
            margin: 10px 0;
        }

        @media (max-width: 800px) {
            .sidebar {
                display: none;
            }

            .messages {
                padding: 25px 5%;
            }

            .input-area {
                padding: 15px 5%;
            }

            .bubble {
                max-width: 85%;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">

            <div class="logo">S</div>

            <div class="brand-text">
                <h1>Shadow.Ai</h1>
                <span>دستیار هوش مصنوعی</span>
            </div>

        </div>

        <button class="new-chat" onclick="newChat()">
            + گفتگوی جدید
        </button>

        <div class="menu-title">
            گفتگوهای اخیر
        </div>

        <div class="history" id="history">
        </div>

        <div class="settings">
            ⚙ تنظیمات
        </div>

    </aside>


    <!-- CHAT -->

    <main class="chat">

        <header class="topbar">

            <div class="topbar-title">
                Shadow.Ai
            </div>

            <div class="status">
                ● آنلاین
            </div>

        </header>


        <section class="messages" id="messages">

            <div class="welcome" id="welcome">

                <div class="welcome-logo">
                    S
                </div>

                <h2>
                    سلام 👋
                </h2>

                <p>
                    من Shadow.Ai هستم.<br>
                    هر سوالی داری از من بپرس.
                </p>

            </div>

        </section>


        <div class="input-area">

            <div id="typing"></div>

            <div class="input-box">

                <textarea
                    id="message"
                    placeholder="پیام خود را بنویسید..."
                    onkeydown="handleKey(event)"
                ></textarea>

                <button
                    class="send"
                    id="sendButton"
                    onclick="sendMessage()"
                >
                    ➤
                </button>

            </div>

        </div>

    </main>

</div>


<script>

    const messageInput = document.getElementById("message");
    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");
    const sendButton = document.getElementById("sendButton");
    const typing = document.getElementById("typing");
    const history = document.getElementById("history");


    function handleKey(event) {

        if (event.key === "Enter" && !event.shiftKey) {

            event.preventDefault();

            sendMessage();
        }
    }


    function addMessage(text, type) {

        if (welcome) {
            welcome.style.display = "none";
        }

        const message = document.createElement("div");

        message.className = "message " + type;

        const avatar = document.createElement("div");

        avatar.className = "avatar";

        avatar.textContent = type === "user" ? "شما" : "S";


        const bubble = document.createElement("div");

        bubble.className = "bubble";

        bubble.textContent = text;


        message.appendChild(avatar);
        message.appendChild(bubble);

        messages.appendChild(message);

        messages.scrollTop = messages.scrollHeight;
    }


    async function sendMessage() {

        const text = messageInput.value.trim();

        if (!text) {
            return;
        }

        addMessage(text, "user");

        messageInput.value = "";

        sendButton.disabled = true;

        typing.innerHTML =
            '<div class="typing">Shadow.Ai در حال پاسخ دادن است...</div>';


        try {

            const response = await fetch("/chat", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: text
                })

            });


            const data = await response.json();


            if (!response.ok) {

                throw new Error(
                    data.detail || "خطایی رخ داده است."
                );

            }


            addMessage(
                data.answer,
                "ai"
            );


        } catch (error) {

            addMessage(
                "متأسفانه خطایی رخ داد:\n" + error.message,
                "ai"
            );

        } finally {

            sendButton.disabled = false;

            typing.innerHTML = "";

            messageInput.focus();
        }
    }


    function newChat() {

        messages.innerHTML = `

            <div class="welcome" id="welcome">

                <div class="welcome-logo">
                    S
                </div>

                <h2>
                    سلام 👋
                </h2>

                <p>
                    من Shadow.Ai هستم.<br>
                    هر سوالی داری از من بپرس.
                </p>

            </div>

        `;

        messageInput.focus();
    }

</script>

</body>
</html>
